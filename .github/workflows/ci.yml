name: CI

# Pushes to main run CI through the release workflow, which calls this one.
on:
  pull_request:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CI: true
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  unit:
    name: Types & unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
        with:
          turbo-cache-key: unit
      - name: Type check
        run: nub exec turbo run check-types --ui=stream
      # Storybook runs its stories in a real browser; that has its own job.
      - name: Unit tests
        run: nub exec turbo run test:unit --ui=stream --filter=!@miguelfranken/storybook

  storybook:
    name: Storybook browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
        with:
          turbo-cache-key: storybook
      - name: Get Playwright version
        id: playwright
        run: echo "version=$(node -p "require('./apps/storybook/node_modules/playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium
      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: apps/storybook
        run: nub exec playwright install --with-deps chromium
      # The browser binary is cached, but its system libraries are not.
      - name: Install Chromium system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: apps/storybook
        run: nub exec playwright install-deps chromium
      - name: Storybook tests
        run: nub exec turbo run test:unit --ui=stream --filter=@miguelfranken/storybook

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # The S3 stub for the S3 storage suites: LocalStack, S3 only. Pinned to
      # a community image that runs without an auth token; newer images need one.
      localstack:
        image: localstack/localstack:4.14.0
        env:
          SERVICES: s3
          # Check presigned signatures as S3 does, so a tampered upload fails.
          S3_SKIP_SIGNATURE_VALIDATION: '0'
        ports:
          - 4566:4566
        options: >-
          --health-cmd "curl -fsS http://localhost:4566/_localstack/health"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 24
    env:
      TEST_DATABASE_URL: postgres://postgres:test@localhost:5432/postgres
      TEST_S3_ENDPOINT: http://localhost:4566
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
        with:
          turbo-cache-key: integration
      - name: Integration tests
        run: nub exec turbo run test:integration --ui=stream
