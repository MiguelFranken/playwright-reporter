name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: true
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  unit:
    name: Types & unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v3
      - run: nub ci
      - name: Type check
        run: nub exec turbo run check-types --ui=stream
      # Storybook runs its stories in a real browser; that has its own job.
      - name: Unit tests
        run: nub exec turbo run test:unit --ui=stream --filter=!@repo/storybook

  storybook:
    name: Storybook browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v3
      - run: nub ci
      - name: Install Chromium
        working-directory: apps/storybook
        run: nub exec playwright install --with-deps chromium
      - name: Storybook tests
        run: nub exec turbo run test:unit --ui=stream --filter=@repo/storybook

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:test@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v3
      - run: nub ci
      - name: Integration tests
        run: nub exec turbo run test:integration --ui=stream
