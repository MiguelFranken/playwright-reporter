name: CI

# Pushes to main run CI through the release workflow, which calls this one.
on:
  pull_request:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CI: true
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  unit:
    name: Types & unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
        with:
          turbo-cache-key: unit
      - name: Type check
        run: nub exec turbo run check-types --ui=stream
      # Storybook runs its stories in a real browser; that has its own job.
      - name: Unit tests
        run: nub exec turbo run test:unit --ui=stream --filter=!@miguelfranken/storybook

  api-contract:
    name: REST API contract
    # The committed docs/openapi.json is checked against the router by a unit
    # test; this compares it with the base branch, so v1 only ever grows.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Base branch document
        id: base
        run: |
          if git show "origin/${{ github.base_ref }}:docs/openapi.json" > "$RUNNER_TEMP/openapi-base.json" 2>/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::docs/openapi.json does not exist on ${{ github.base_ref }} yet; nothing to compare."
          fi
      - name: Breaking changes
        if: steps.base.outputs.exists == 'true'
        uses: oasdiff/oasdiff-action/breaking@5e81b5c380accc6b523f9d32a637ca630e33620b # v0.1.17
        with:
          base: ${{ runner.temp }}/openapi-base.json
          revision: docs/openapi.json
          fail-on: ERR
          review: false

  storybook:
    name: Storybook browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
        with:
          turbo-cache-key: storybook
      - name: Get Playwright version
        id: playwright
        run: echo "version=$(node -p "require('./apps/storybook/node_modules/playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium
      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: apps/storybook
        run: nub exec playwright install --with-deps chromium
      # The browser binary is cached, but its system libraries are not.
      - name: Install Chromium system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: apps/storybook
        run: nub exec playwright install-deps chromium
      - name: Storybook tests
        run: nub exec turbo run test:unit --ui=stream --filter=@miguelfranken/storybook

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # The S3 stub for the S3 storage suites: RustFS, an Apache-2.0
      # S3-compatible server that checks signatures the way S3 does.
      rustfs:
        image: rustfs/rustfs:1.0.0
        env:
          RUSTFS_ACCESS_KEY: pwr-test-access-key
          RUSTFS_SECRET_KEY: pwr-test-secret-key
        ports:
          - 9000:9000
        options: >-
          --health-cmd "curl -fsS http://localhost:9000/health/ready"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 24
    env:
      TEST_DATABASE_URL: postgres://postgres:test@localhost:5432/postgres
      TEST_S3_ENDPOINT: http://localhost:9000
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
        with:
          turbo-cache-key: integration
      - name: Integration tests
        run: nub exec turbo run test:integration --ui=stream
